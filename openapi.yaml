components:
  schemas:
    AddFoodCommand:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AddFoodCommand.json
          format: uri
          readOnly: true
          type: string
        description:
          description: A description of the food item
          type: string
        image_file_id:
          description: The ID of the image file for the food item
          type: string
        name:
          description: The name of the food item
          type: string
        price:
          description: The price of the food item in cents
          format: int64
          type: integer
      required:
        - name
        - price
        - description
      type: object
    AddFoodResult:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AddFoodResult.json
          format: uri
          readOnly: true
          type: string
        food_id:
          description: The ID of the newly created food item
          type: string
      required:
        - food_id
      type: object
    AppMetadata:
      additionalProperties: false
      properties:
        avatar_url:
          type: string
        display_name:
          type: string
        provider:
          type: string
        providers:
          items:
            type: string
          type: array
      required:
        - avatar_url
        - display_name
        - provider
        - providers
      type: object
    CreatePollCommand:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreatePollCommand.json
          format: uri
          readOnly: true
          type: string
        food_ids:
          description: List of food IDs to include in the poll
          items:
            type: string
          minItems: 1
          type: array
        order_date:
          description: Date for which the poll is being created in RFC3339 format
          format: date-time
          type: string
        scheduled_close_at:
          description: Scheduled closing time for the poll in RFC3339 format
          format: date-time
          type: string
        strategy:
          description: Polling strategy to be used
          enum:
            - ORDER_PERSONAL_CHOICE
            - ORDER_CONSENSUS_ITEM
          type: string
      required:
        - order_date
        - scheduled_close_at
        - food_ids
        - strategy
      type: object
    CreatePollResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreatePollResponse.json
          format: uri
          readOnly: true
          type: string
        poll_id:
          description: The ID of the created poll
          type: string
      required:
        - poll_id
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type: array
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    Food:
      additionalProperties: false
      properties:
        id:
          type: string
        image_url:
          type:
            - string
            - "null"
        name:
          type: string
      required:
        - id
        - name
        - image_url
      type: object
    GetCentrifugoJWTResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/GetCentrifugoJWTResponse.json
          format: uri
          readOnly: true
          type: string
        token:
          description: The generated JWT token for Centrifugo authentication
          type: string
      required:
        - token
      type: object
    GetFoodsQueryResponse:
      additionalProperties: false
      properties:
        description:
          type: string
        id:
          type: string
        image_url:
          type:
            - string
            - "null"
        name:
          type: string
        price:
          format: int64
          type: integer
        user:
          $ref: "#/components/schemas/UserProfile"
      required:
        - id
        - name
        - image_url
        - description
        - price
        - user
      type: object
    GetOrderedItemsResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/GetOrderedItemsResponse.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/OrderedItem"
          type: array
      required:
        - items
      type: object
    GetShoppingOrderResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/GetShoppingOrderResponse.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/ShoppingItem"
          type: array
        total_price:
          format: int64
          type: integer
      required:
        - items
        - total_price
      type: object
    GetTodayOrdersResponse:
      additionalProperties: false
      properties:
        buyer:
          $ref: "#/components/schemas/UserProfile"
        order_items:
          items:
            $ref: "#/components/schemas/OrderItem"
          type: array
        poll_id:
          type: string
        total_price:
          format: int64
          type: integer
      required:
        - poll_id
        - buyer
        - total_price
        - order_items
      type: object
    GetTodayPollsQueryResponse:
      additionalProperties: false
      properties:
        closed_at:
          format: date-time
          type:
            - string
            - "null"
        creator:
          $ref: "#/components/schemas/UserProfile"
        id:
          type: string
        order_date:
          format: date-time
          type: string
        poll_options:
          items:
            $ref: "#/components/schemas/PollOption"
          type: array
        scheduled_closes_at:
          format: date-time
          type: string
        strategy:
          enum:
            - ORDER_CONSENSUS_ITEM
            - ORDER_PERSONAL_CHOICE
          type: string
      required:
        - id
        - creator
        - scheduled_closes_at
        - strategy
        - closed_at
        - poll_options
        - order_date
      type: object
    Identity:
      additionalProperties: false
      properties:
        created_at:
          type: string
        email:
          type: string
        id:
          type: string
        identity_data:
          $ref: "#/components/schemas/IdentityData"
        identity_id:
          type: string
        last_sign_in_at:
          type: string
        provider:
          type: string
        updated_at:
          type: string
        user_id:
          type: string
      required:
        - identity_id
        - id
        - user_id
        - identity_data
        - provider
        - last_sign_in_at
        - created_at
        - updated_at
        - email
      type: object
    IdentityData:
      additionalProperties: false
      properties:
        email:
          type: string
        email_verified:
          type: boolean
        phone_verified:
          type: boolean
        sub:
          type: string
      required:
        - email
        - email_verified
        - phone_verified
        - sub
      type: object
    OrderItem:
      additionalProperties: false
      properties:
        details:
          items:
            $ref: "#/components/schemas/OrderItemDetail"
          type: array
        food_image_url:
          type:
            - string
            - "null"
        food_name:
          type: string
        price_at_order:
          format: int64
          type: integer
      required:
        - food_name
        - food_image_url
        - price_at_order
        - details
      type: object
    OrderItemDetail:
      additionalProperties: false
      properties:
        quantity:
          format: int64
          type: integer
        user:
          $ref: "#/components/schemas/UserProfile"
      required:
        - user
        - quantity
      type: object
    OrderedItem:
      additionalProperties: false
      properties:
        buyer:
          $ref: "#/components/schemas/UserProfile"
        food_id:
          type: string
        food_name:
          type: string
        food_url:
          type: string
        quantity:
          format: int64
          type: integer
        total_price:
          format: int64
          type: integer
        unit_price:
          format: int64
          type: integer
      required:
        - food_id
        - food_name
        - food_url
        - quantity
        - unit_price
        - total_price
        - buyer
      type: object
    PollOption:
      additionalProperties: false
      properties:
        food:
          $ref: "#/components/schemas/Food"
        id:
          type: string
        price_at_creation:
          format: int64
          type: integer
        votes:
          items:
            $ref: "#/components/schemas/Vote"
          type: array
      required:
        - id
        - food
        - price_at_creation
        - votes
      type: object
    Post-by-id-voteRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Post-by-id-voteRequest.json
          format: uri
          readOnly: true
          type: string
        poll_option_id:
          description: The ID of the poll option to vote for
          format: uuid
          type: string
      required:
        - poll_option_id
      type: object
    Put-by-idRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Put-by-idRequest.json
          format: uri
          readOnly: true
          type: string
        description:
          description: A description of the food item
          type: string
        image_file_id:
          description: The ID of the image file for the food item
          type: string
        name:
          description: The name of the food item
          type: string
        price:
          description: The price of the food item in cents
          format: int64
          type: integer
      required:
        - name
        - description
        - price
      type: object
    ShoppingItem:
      additionalProperties: false
      properties:
        food_id:
          type: string
        food_name:
          type: string
        quantity:
          format: int64
          type: integer
        total_price:
          format: int64
          type: integer
        unit_price:
          format: int64
          type: integer
        users:
          items:
            $ref: "#/components/schemas/UserProfile"
          minItems: 1
          type: array
      required:
        - food_id
        - food_name
        - quantity
        - unit_price
        - total_price
        - users
      type: object
    UserMetadata:
      additionalProperties: false
      properties:
        email_verified:
          type: boolean
      required:
        - email_verified
      type: object
    UserProfile:
      additionalProperties: false
      properties:
        avatar_url:
          type: string
        created_at:
          format: date-time
          type: string
        display_name:
          type: string
        id:
          type: string
      required:
        - id
        - avatar_url
        - display_name
        - created_at
      type: object
    Vote:
      additionalProperties: false
      properties:
        voter:
          $ref: "#/components/schemas/UserProfile"
      required:
        - voter
      type: object
info:
  title: Weeate API
  version: v1.0.0
openapi: 3.1.0
paths:
  /:
    get:
      operationId: get
      responses:
        "204":
          description: No Content
          headers:
            AppMetadata:
              schema:
                $ref: "#/components/schemas/AppMetadata"
            Audience:
              schema:
                type: string
            ConfirmedAt:
              schema:
                type: string
            CreatedAt:
              schema:
                type: string
            Email:
              schema:
                type: string
            EmailConfirmedAt:
              schema:
                type: string
            ID:
              schema:
                type: string
            Identities:
              schema:
                $ref: "#/components/schemas/Identity"
            IdentityData:
              schema:
                $ref: "#/components/schemas/IdentityData"
            IdentityID:
              schema:
                type: string
            IsAnonymous:
              schema:
                type: boolean
            LastSignInAt:
              schema:
                type: string
            Phone:
              schema:
                type: string
            Provider:
              schema:
                type: string
            Role:
              schema:
                type: string
            UpdatedAt:
              schema:
                type: string
            UserID:
              schema:
                type: string
            UserMetadata:
              schema:
                $ref: "#/components/schemas/UserMetadata"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get
  /auth/centrifugo/token:
    get:
      operationId: get-auth-centrifugo-token
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetCentrifugoJWTResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get auth centrifugo token
  /foods/:
    get:
      operationId: list-foods
      parameters:
        - description: The ID of the user whose foods to retrieve (optional)
          explode: false
          in: query
          name: user_id
          schema:
            description: The ID of the user whose foods to retrieve (optional)
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/GetFoodsQueryResponse"
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List foods
    post:
      operationId: post-foods
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddFoodCommand"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddFoodResult"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Post foods
  /foods/{id}:
    delete:
      operationId: delete-foods-by-id
      parameters:
        - description: The ID of the food item to be deleted
          in: path
          name: id
          required: true
          schema:
            description: The ID of the food item to be deleted
            format: uuid
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete foods by ID
    put:
      operationId: put-foods-by-id
      parameters:
        - description: The ID of the food item to be updated
          in: path
          name: id
          required: true
          schema:
            description: The ID of the food item to be updated
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Put-by-idRequest"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Put foods by ID
  /ordered-items:
    get:
      operationId: get-ordered-items
      parameters:
        - description: The date to get ordered items for
          explode: false
          in: query
          name: date
          schema:
            description: The date to get ordered items for
            format: date-time
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetOrderedItemsResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get ordered items
  /orders/today:
    get:
      operationId: list-orders-today
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/GetTodayOrdersResponse"
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List orders today
  /polls/:
    post:
      operationId: post-polls
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePollCommand"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatePollResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Post polls
  /polls/today:
    get:
      operationId: list-polls-today
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/GetTodayPollsQueryResponse"
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List polls today
  /polls/{id}/close:
    post:
      operationId: post-polls-by-id-close
      parameters:
        - description: The ID of the poll to be closed
          in: path
          name: id
          required: true
          schema:
            description: The ID of the poll to be closed
            format: uuid
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Post polls by ID close
  /polls/{id}/vote:
    post:
      operationId: post-polls-by-id-vote
      parameters:
        - description: The ID of the poll to cast a vote on
          in: path
          name: id
          required: true
          schema:
            description: The ID of the poll to cast a vote on
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Post-by-id-voteRequest"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Post polls by ID vote
  /shopping-order:
    get:
      operationId: get-shopping-order
      parameters:
        - description: The date to get the shopping order for
          explode: false
          in: query
          name: date
          schema:
            description: The date to get the shopping order for
            format: date-time
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetShoppingOrderResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get shopping order
tags:
  - description: Endpoints for managing food items
    name: Foods
  - description: Endpoints for managing polls
    name: Polls
  - description: Endpoints for managing orders
    name: Orders

version: 43
jobs:
- name: go ci
  steps:
  - type: CheckoutStep
    name: checkout code
    cloneCredential:
      type: DefaultCredential
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - type: GenerateChecksumStep
    name: generate dependency checksum
    files: '**/go.mod'
    targetFile: checksum
    condition: SUCCESSFUL
    optional: false
  - type: SetupCacheStep
    name: set up dependency cache
    key: go_cache_@file:checksum@
    loadKeys:
    - go_cache
    paths:
    - /root/.cache/go_build
    - /root/.cache/golangci-lint
    - /go/pkg/mod
    uploadStrategy: UPLOAD_IF_NOT_HIT
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: build and test
    runInContainer: true
    image: golang:@script:builtin:golang:determine-go-version@
    interpreter:
      type: DefaultInterpreter
      commands: "set -e\n# Use double at to avoid being interpreted as OneDev variable substitution\ngo install github.com/axw/gocov/gocov@@latest\ngo install github.com/AlekSi/gocov-xml@@latest\ngo install github.com/jstemmer/go-junit-report/v2@@latest\nset +e\n# Turn off vet as the \"check and lint\" step can do this \ngo test -vet=off -v -coverprofile=coverage.out ./... > test-result.out\nTEST_STATUS=$?\ngo-junit-report -in test-result.out -out test-result.xml -set-exit-code\nif [ $? -ne 0 ]; then echo \"\\033[1;31mThere are test failures. Check test report for details\\033[0m\"; exit 1; fi\nif [ $TEST_STATUS -ne 0 ]; then exit 1; fi\ngocov convert coverage.out | gocov-xml > coverage.xml"
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: check and lint
    runInContainer: true
    image: golangci/golangci-lint
    interpreter:
      type: DefaultInterpreter
      commands: golangci-lint run --timeout=10m --issues-exit-code=0 --out-format=checkstyle > lint-result.xml
    useTTY: true
    condition: NEVER
    optional: false
  - type: PublishCoberturaReportStep
    name: publish coverage report
    reportName: Coverage
    filePatterns: coverage.xml
    condition: ALWAYS
    optional: false
  - type: PublishJUnitReportStep
    name: publish unit test report
    reportName: Unit Test
    filePatterns: test-result.xml
    condition: ALWAYS
    optional: false
  - type: PublishCheckstyleReportStep
    name: publish lint report
    reportName: Lint
    filePatterns: lint-result.xml
    tabWidth: 1
    failThreshold: HIGH
    condition: ALWAYS
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    userMatch: anyone
  - type: PullRequestUpdateTrigger
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 14400

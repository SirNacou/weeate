name: weeate

services:
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile.dev
    container_name: frontend
    env_file:
      - .env
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    ports:
      - 3000:3000
    volumes:
      - ./frontend/:/app/frontend/
      - ./.env:/app/.env
      - ./.env.local:/app/.env.local
    restart: on-failure

  backend:
    image: cosmtrek/air
    working_dir: /app
    container_name: backend
    ports:
      - 8080:8080
    env_file:
      - .env
    depends_on:
      - postgres
      - centrifugo
    volumes:
      - ./backend/:/app/backend/:ro
      - ./go.mod:/app/go.mod
      - ./go.sum:/app/go.sum
      - ./.air.toml:/app/.air.toml
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/livez"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  centrifugo:
    container_name: centrifugo
    image: centrifugo/centrifugo:v6
    env_file:
      - .env
    volumes:
      - ./centrifugo/config.json:/centrifugo/config.json
    command: centrifugo -c config.json
    ports:
      - 8000:8000
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:18
    container_name: postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: on-failure
    shm_size: 128mb
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "user", "-d", "appdb"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  db_data:

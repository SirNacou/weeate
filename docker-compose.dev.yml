name: weeate

services:
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile.dev
    container_name: frontend
    env_file:
      - .env
      - .env.local
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    ports:
      - 3000:3000
    volumes:
      - ./frontend/:/app/frontend/
      - frontend_node_modules:/app/frontend/node_modules
      - ./.env:/app/.env
      - ./.env.local:/app/.env.local
    restart: on-failure

  backend:
    image: cosmtrek/air
    working_dir: /app
    container_name: backend
    ports:
      - 8080:8080
    env_file:
      - .env
      - .env.local
    depends_on:
      - postgres
      - centrifugo
    volumes:
      - ./backend/:/app/backend/:ro
      - ./go.mod:/app/go.mod
      - ./go.sum:/app/go.sum
      - ./.air.toml:/app/.air.toml
    restart: on-failure

  centrifugo:
    container_name: centrifugo
    image: centrifugo/centrifugo:v6
    env_file:
      - .env.local
    volumes:
      - ./centrifugo/config.json:/centrifugo/config.json
    command: centrifugo -c config.json
    ports:
      - 8000:8000
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  postgres:
    image: postgres:18-alpine
    container_name: postgres
    env_file:
      - .env
      - .env.local
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: on-failure
    shm_size: 128mb

volumes:
  db_data:
  frontend_node_modules:

name: weeate

services:
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile.dev
    container_name: frontend
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    ports:
      - 3000:3000
    volumes:
      - ./frontend/:/app/
      - /app/node_modules

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile.dev
    container_name: backend
    ports:
      - 40000:40000
      - 8080:8080
    env_file:
      - .env
    environment:
      - GO_ENV=development
    depends_on:
      postgres:
        condition: service_healthy
      centrifugo:
        condition: service_healthy
    volumes:
      - ./backend/:/app/backend/
      - ./go.mod:/app/go.mod
      - ./go.sum:/app/go.sum
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/livez"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  centrifugo:
    container_name: centrifugo
    image: centrifugo/centrifugo:v6
    env_file:
      - .env
    volumes:
      - ./centrifugo/config.json:/centrifugo/config.json
    command: centrifugo -c config.json
    expose:
      - 8000
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:18-alpine
    container_name: postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-U",
          "${POSTGRES_USER:-user}",
          "-d",
          "${POSTGRES_DB:-weeate}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
      centrifugo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  db_data:

name: weeate

services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - 80:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
      - centrifugo
    restart: on-failure

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: frontend
    env_file:
      - .env
    expose:
      - 3000
    depends_on:
      backend:
        condition: service_healthy
    restart: on-failure

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: backend
    expose:
      - 8080
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      centrifugo:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/livez"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  centrifugo:
    container_name: centrifugo
    image: centrifugo/centrifugo:v6
    env_file:
      - .env
    volumes:
      - ./centrifugo/config.json:/centrifugo/config.json
    command: centrifugo -c config.json
    expose:
      - 8000
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:18-alpine
    container_name: postgres
    env_file:
      - .env
    # ports:
    #   - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: on-failure
    shm_size: 1gb
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-U",
          "${POSTGRES_USER:-user}",
          "-d",
          "${POSTGRES_DB:-weeate}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  db_data:
